<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snoopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one portrait game stage (400x640 logical) centred on a Sunday-comics halftone sky; HTML panels float over the canvas. Single deliberate look in both themes. */
:root {
  --ink: #1d1a17;
  --paper: #fffdf6;
  --red: #e23b2e;
  --sun: #ffcf3a;
  --page: #8fd0f2;
  --dot: #b7e2f8;
  --display: 'Gaegu', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --body: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --u: 1px;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background-color: var(--page);
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--body);
}
#wrap {
  position: fixed; inset: 0;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
}
#fit { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative;
  border-radius: calc(var(--u) * 14);
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--ink), 7px 7px 0 3px var(--ink);
  background: var(--page);
}
#cv { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }

.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(var(--u) * 22);
  box-sizing: border-box;
  background: rgba(29, 26, 23, 0.22);
}
.overlay.top { justify-content: flex-start; background: transparent; padding-top: calc(var(--u) * 58); }
.overlay.bottom { justify-content: flex-end; background: transparent; pointer-events: none; padding-bottom: calc(var(--u) * 26); }
.overlay.bottom > * { pointer-events: auto; }
.overlay.full { background: rgba(29, 26, 23, 0.35); }

.panel {
  background: var(--paper);
  border: calc(var(--u) * 3) solid var(--ink);
  border-radius: calc(var(--u) * 16);
  box-shadow: calc(var(--u) * 6) calc(var(--u) * 6) 0 var(--ink);
  padding: calc(var(--u) * 18) calc(var(--u) * 22) calc(var(--u) * 22);
  text-align: center;
  width: 100%;
  max-width: calc(var(--u) * 340);
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 10);
  animation: pop 0.35s cubic-bezier(.2, 1.6, .4, 1) both;
}
.panel.tilt { transform: rotate(-1.5deg); }
@keyframes pop { from { transform: scale(.88); } }

.logo {
  margin: 0;
  font-family: var(--display); font-weight: 700;
  font-size: calc(var(--u) * 96); line-height: .85;
  color: var(--red);
  -webkit-text-stroke: calc(var(--u) * 3) var(--ink);
  paint-order: stroke fill;
  text-shadow: calc(var(--u) * 4) calc(var(--u) * 4) 0 var(--ink);
  letter-spacing: .03em;
}
.sub { margin: 0; font-size: calc(var(--u) * 22); line-height: 1.2; }
.eyebrow {
  margin: 0;
  font-size: calc(var(--u) * 16); letter-spacing: .12em; text-transform: uppercase;
  color: var(--red);
}
h2 {
  margin: 0;
  font-family: var(--display); font-weight: 700;
  font-size: calc(var(--u) * 44); line-height: .95;
  text-wrap: balance;
}
.copy { margin: 0; font-size: calc(var(--u) * 20); line-height: 1.25; text-wrap: pretty; }
.how {
  margin: 0; width: 100%;
  font-size: calc(var(--u) * 17); line-height: 1.25;
  background: #eef7fc;
  border: calc(var(--u) * 2) dashed var(--ink);
  border-radius: calc(var(--u) * 10);
  padding: calc(var(--u) * 8) calc(var(--u) * 10);
  box-sizing: border-box;
}
.levels {
  list-style: none; margin: calc(var(--u) * 2) 0; padding: 0;
  display: flex; flex-direction: column; gap: calc(var(--u) * 5);
  font-size: calc(var(--u) * 21); text-align: left;
}
.levels li { display: flex; align-items: center; gap: calc(var(--u) * 10); }
.levels b {
  display: inline-grid; place-items: center;
  width: calc(var(--u) * 28); height: calc(var(--u) * 28);
  border: calc(var(--u) * 2.5) solid var(--ink); border-radius: 50%;
  background: var(--sun);
  font-family: var(--display); font-size: calc(var(--u) * 20);
}
.btn {
  font-family: var(--display); font-weight: 700;
  font-size: calc(var(--u) * 32); line-height: 1;
  color: #fff; background: var(--red);
  border: calc(var(--u) * 3) solid var(--ink);
  border-radius: calc(var(--u) * 14);
  padding: calc(var(--u) * 9) calc(var(--u) * 30) calc(var(--u) * 11);
  box-shadow: calc(var(--u) * 4) calc(var(--u) * 4) 0 var(--ink);
  cursor: pointer; touch-action: manipulation;
  margin-top: calc(var(--u) * 4);
}
.btn.light { background: var(--paper); color: var(--ink); font-size: calc(var(--u) * 24); }
.btn:active { transform: translate(calc(var(--u) * 3), calc(var(--u) * 3)); box-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--ink); }
.btn:focus-visible, .mute:focus-visible { outline: calc(var(--u) * 3) dashed var(--ink); outline-offset: calc(var(--u) * 4); }

.mute {
  position: absolute; top: calc(var(--u) * 14); right: calc(var(--u) * 14); z-index: 5;
  font-family: var(--body); font-size: calc(var(--u) * 17); color: var(--ink);
  background: var(--paper);
  border: calc(var(--u) * 2.5) solid var(--ink); border-radius: calc(var(--u) * 10);
  box-shadow: calc(var(--u) * 3) calc(var(--u) * 3) 0 var(--ink);
  padding: calc(var(--u) * 4) calc(var(--u) * 10);
  cursor: pointer;
}

/* Prize ticket */
.ticket {
  width: 100%;
  display: flex;
  background: var(--sun);
  border: calc(var(--u) * 3) solid var(--ink);
  border-radius: calc(var(--u) * 12);
  overflow: hidden;
  transform: rotate(-2deg);
  margin: calc(var(--u) * 6) 0;
  text-align: left;
}
.stub {
  flex: 0 0 calc(var(--u) * 64);
  background: var(--red); color: #fff;
  border-right: calc(var(--u) * 3) dashed var(--ink);
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 700;
  font-size: calc(var(--u) * 20); line-height: .95; text-align: center;
  -webkit-text-stroke: calc(var(--u) * 1) var(--ink); paint-order: stroke fill;
}
.tk {
  flex: 1; min-width: 0;
  padding: calc(var(--u) * 10) calc(var(--u) * 12);
  display: flex; flex-direction: column; gap: calc(var(--u) * 4);
}
.tk-top { font-size: calc(var(--u) * 13); letter-spacing: .14em; text-transform: uppercase; }
.tk-main { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 30); line-height: .95; }
.tk-fine { font-size: calc(var(--u) * 16); line-height: 1.2; }
.tk-meta { font-size: calc(var(--u) * 13); letter-spacing: .06em; font-variant-numeric: tabular-nums; border-top: calc(var(--u) * 2) dotted var(--ink); padding-top: calc(var(--u) * 5); }

@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
}
</style>
<meta name="description" content="Snoopy: a three-level birthday game you play in the browser.">
</head>
<body>
<div id="wrap"><div id="fit">
  <div id="stage">
    <canvas id="cv" aria-label="Snoopy birthday game"></canvas>
    <button id="mute" class="mute" type="button" aria-pressed="false">♪ Sound on</button>
    <div id="overlay" class="overlay" hidden></div>
  </div>
</div></div>

<script>
(() => {
'use strict';

// ---- Change this to personalise the game ----
const MOM = 'Mom';

const W = 400, H = 640;
const DISPLAY = "'Gaegu', 'Comic Sans MS', cursive";
const BODY = "'Patrick Hand', 'Comic Sans MS', cursive";
const C = {
  ink: '#1d1a17', white: '#ffffff', paper: '#fffdf6', red: '#e23b2e', roof: '#9c2a1f',
  pink: '#ff6f91', yellow: '#ffcf3a', blue: '#4aa3df', green: '#7cc860', grass2: '#5fae47',
  sky1: '#7cc8f0', sky2: '#dff4ff', tan: '#d9a35b', brown: '#7a4a2a', purple: '#9b6fd6',
  orange: '#ff9b3d', storm: '#6f7888', rain: '#8d96a5', drop: '#3b8fd9'
};
const CONFETTI = [C.red, C.yellow, C.blue, C.pink, C.green, C.purple];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const fit = document.getElementById('fit');
const overlay = document.getElementById('overlay');
const muteBtn = document.getElementById('mute');

// ---------- sizing ----------
function resize() {
  const r = fit.getBoundingClientRect();
  const scale = Math.max(0.3, Math.min(r.width / W, r.height / H));
  const sw = Math.floor(W * scale), sh = Math.floor(H * scale);
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  stage.style.setProperty('--u', (sw / W) + 'px');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(sw * dpr);
  cv.height = Math.round(sh * dpr);
}
addEventListener('resize', resize);
resize();

// ---------- input ----------
const input = { px: W / 2, py: H / 2, down: false, inside: false, type: 'mouse', keys: {} };
function setPtr(e) {
  const r = cv.getBoundingClientRect();
  input.px = (e.clientX - r.left) / r.width * W;
  input.py = (e.clientY - r.top) / r.height * H;
  input.type = e.pointerType || 'mouse';
  input.inside = true;
}
cv.addEventListener('pointerdown', e => { setPtr(e); input.down = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} audio(); });
cv.addEventListener('pointermove', e => setPtr(e));
cv.addEventListener('pointerup', () => { input.down = false; });
cv.addEventListener('pointercancel', () => { input.down = false; });
cv.addEventListener('pointerleave', () => { if (!input.down) input.inside = false; });
const KEYMAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k) { input.keys[k] = true; if (scene && !scene.paused) e.preventDefault(); } });
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) input.keys[k] = false; });
addEventListener('blur', () => { input.keys = {}; input.down = false; });
const key = k => !!input.keys[k];
const steering = () => input.inside && (input.down || input.type === 'mouse');

// ---------- audio ----------
let actx = null, muted = false;
try { muted = localStorage.getItem('snoopy-muted') === '1'; } catch (_) {}
function syncMute() { muteBtn.textContent = muted ? '♪ Sound off' : '♪ Sound on'; muteBtn.setAttribute('aria-pressed', String(muted)); }
syncMute();
muteBtn.addEventListener('click', () => {
  muted = !muted; syncMute();
  try { localStorage.setItem('snoopy-muted', muted ? '1' : '0'); } catch (_) {}
  if (!muted) { audio(); sfx.collect(); }
});
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; } }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type = 'triangle', vol = 0.08, when = 0) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  collect() { tone(880, 0.09); tone(1320, 0.14, 'triangle', 0.08, 0.06); },
  hurt() { tone(220, 0.18, 'sawtooth', 0.05); tone(150, 0.25, 'sawtooth', 0.05, 0.08); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.09, i * 0.1)); },
  click() { tone(660, 0.06, 'square', 0.04); }
};
function happyBirthday() {
  const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const song = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
  ];
  const beat = 0.36; let t = 0.15;
  for (const [n, d] of song) { tone(N[n], Math.max(0.2, d * beat * 0.95), 'triangle', 0.1, t); tone(N[n] / 2, Math.max(0.2, d * beat * 0.9), 'sine', 0.05, t); t += d * beat; }
}

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const TAU = Math.PI * 2;

function ell(x, y, rx, ry, rot = 0) { return () => ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Draw a group of shapes as one inked silhouette: thick strokes first, then fills on top.
function blob(shapes, fill, lw = 2.5) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = C.ink; ctx.lineWidth = lw * 2;
  for (const s of shapes) { ctx.beginPath(); s(); ctx.stroke(); }
  ctx.fillStyle = fill;
  for (const s of shapes) { ctx.beginPath(); s(); ctx.fill(); }
}
function inked(pathFn, fill, lw = 2.5) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); pathFn();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.stroke();
}
function shadow(x, y, rx) {
  ctx.fillStyle = 'rgba(29,26,23,0.16)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, rx * 0.3, 0, 0, TAU); ctx.fill();
}

// ---------- characters & props ----------
function drawBeagle(x, y, s, o = {}) {
  const t = o.t || 0, pose = o.pose || 'stand', f = o.facing || 1;
  ctx.save();
  ctx.translate(x, y); ctx.scale(s * f, s);
  if (o.tilt) ctx.rotate(o.tilt);
  if (o.scarf) {
    const w = Math.sin(t * 12) * 5;
    inked(() => {
      ctx.moveTo(-6, -7);
      ctx.bezierCurveTo(-24, -12 + w, -38, -2 - w, -54, -9 + w);
      ctx.lineTo(-52, 2 + w);
      ctx.bezierCurveTo(-38, 7 - w, -24, 1 + w, -6, 3);
      ctx.closePath();
    }, C.red, 2);
  }
  let lf = 0, rf = 0, bob = 0;
  if (pose === 'walk') { lf = Math.sin(t * 14) * 6; rf = -lf; bob = -Math.abs(Math.sin(t * 14)) * 2; }
  if (pose === 'dance') { bob = -Math.abs(Math.sin(t * 6)) * 9; lf = Math.sin(t * 6) * 6; rf = -lf; }
  ctx.translate(0, bob);
  const armsUp = pose === 'dance' || pose === 'hold';
  const sw = pose === 'dance' ? Math.sin(t * 6) * 0.35 : 0;
  if (armsUp) blob([ell(-19, -24, 3.8, 12, -0.25 + sw)], C.white);
  const low = [ell(-14, 16, 3.5, 7, -0.6)];
  if (pose === 'sit') low.push(ell(4, 28, 9, 4.5), ell(13, 26, 9, 4.5));
  else low.push(ell(-8 + lf, 30, 9, 4.5), ell(8 + rf, 30, 9, 4.5));
  blob(low, C.white);
  blob([ell(0, 12, 14, 19), ell(-2, -20, 15, 15), ell(13, -17, 16, 10.5)], C.white);
  if (!armsUp) blob([ell(10, 8, 3.6, 9, -0.5)], C.white);
  else blob([ell(16, -34, 3.8, 9, 0.25 + sw)], C.white);
  // collar
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, -5); ctx.quadraticCurveTo(0, -1, 9, -5); ctx.stroke();
  // ear
  ctx.fillStyle = C.ink;
  const ew = pose === 'dance' ? Math.sin(t * 6) * 3 : 0;
  ctx.beginPath(); ctx.moveTo(-3, -33);
  ctx.bezierCurveTo(-20 + ew, -34, -24 + ew, -8, -14 + ew, -6);
  ctx.bezierCurveTo(-6, -5, -2, -20, -3, -33); ctx.fill();
  // nose
  ctx.beginPath(); ctx.ellipse(28, -20, 5.5, 4.5, 0, 0, TAU); ctx.fill();
  // eye
  if (o.happy) {
    ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(7, -21, 3.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(7, -23, 1.8, 3.2, 0, 0, TAU); ctx.fill();
  }
  // smile
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, -11); ctx.quadraticCurveTo(18, -5, 25, -12); ctx.stroke();
  if (o.goggles) {
    ctx.strokeStyle = C.brown; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, -27); ctx.quadraticCurveTo(-2, -34, 8, -31); ctx.stroke();
    inked(() => ctx.ellipse(8, -31, 5.5, 4.5, 0, 0, TAU), '#bfe6ff', 2);
  }
  if (pose === 'hold') drawBowl(2, -46, 1);
  if (o.soggy > 0) {
    ctx.fillStyle = C.drop;
    for (let i = 0; i < 3; i++) {
      const p = (t * 1.5 + i / 3) % 1;
      ctx.globalAlpha = 1 - p;
      ctx.beginPath(); ctx.ellipse(-10 + i * 12, -38 + p * 30, 2, 3.2, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawBowl(x, y, s) {
  inked(() => {
    ctx.moveTo(x - 19 * s, y - 4 * s); ctx.lineTo(x + 19 * s, y - 4 * s);
    ctx.lineTo(x + 13 * s, y + 9 * s); ctx.lineTo(x - 13 * s, y + 9 * s); ctx.closePath();
  }, C.red, 2.2);
  inked(() => ctx.ellipse(x, y - 4 * s, 19 * s, 4 * s, 0, 0, TAU), '#b8231a', 2.2);
}
function drawDoghouse(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  inked(() => { ctx.moveTo(-36, 0); ctx.lineTo(-36, -48); ctx.lineTo(0, -80); ctx.lineTo(36, -48); ctx.lineTo(36, 0); ctx.closePath(); }, C.red, 3);
  ctx.strokeStyle = 'rgba(29,26,23,0.28)'; ctx.lineWidth = 1.3;
  for (let i = -24; i <= 24; i += 12) {
    const top = -48 - (36 - Math.abs(i)) * (32 / 36) + 3;
    ctx.beginPath(); ctx.moveTo(i, -2); ctx.lineTo(i, top); ctx.stroke();
  }
  inked(() => { ctx.moveTo(-47, -39); ctx.lineTo(0, -87); ctx.lineTo(47, -39); ctx.lineTo(40, -35); ctx.lineTo(0, -76); ctx.lineTo(-40, -35); ctx.closePath(); }, C.roof, 3);
  ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-14, -22); ctx.arc(0, -22, 14, Math.PI, 0); ctx.lineTo(14, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawFlyer(x, y, t, tilt) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  drawDoghouse(0, 44, 0.85);
  drawBeagle(0, -50, 0.8, { pose: 'sit', scarf: true, goggles: true, t });
  ctx.restore();
}
function drawBird(x, y, s, t, f = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  const flap = Math.sin(t * 22);
  blob([ell(0, 0, 10, 8), ell(6, -8, 7, 7)], C.yellow, 2);
  inked(() => { ctx.moveTo(-2, -1); ctx.lineTo(-14, -6 - flap * 9); ctx.lineTo(-6, 4); ctx.closePath(); }, C.yellow, 2);
  inked(() => { ctx.moveTo(12, -9); ctx.lineTo(18, -7); ctx.lineTo(12, -5); ctx.closePath(); }, C.orange, 1.6);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(8, -10, 1.3, 2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;

const fx = [], texts = [];
let shake = 0;
function burst(x, y, n, colors, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = (o.speed || 140) * (0.4 + Math.random() * 0.8);
    fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up ?? 60), g: o.g ?? 320, life: 0, max: (o.life || 0.7) * (0.7 + Math.random() * 0.6), color: colors[i % colors.length], size: o.size || 6, rot: Math.random() * 6, vr: rand(-10, 10), sway: o.sway || 0, ph: Math.random() * 6 });

function floatText(x, y, text, color = C.ink) { texts.push({ x, y, text, color, life: 0 }); }
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i]; p.life += dt;
    if (p.life > p.max || p.y > H + 20) { fx.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += (p.vx + Math.sin(p.life * 3 + p.ph) * p.sway) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life += dt; t.y -= 45 * dt; if (t.life > 1) texts.splice(i, 1); }
  shake = Math.max(0, shake - dt);
}
function drawFx() {
  for (const p of fx) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - p.life / p.max) * 3);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6);
    ctx.restore();
  }
  for (const t of texts) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - t.life) * 2);
    ctx.font = `700 28px ${DISPLAY}`; ctx.textAlign = 'center';
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = C.paper; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
}

  while (fs > 14 && ctx.measureText(text).width > 176) { fs--; ctx.font = `700 ${fs}px ${DISPLAY}`; }
  ctx.fillText(text, 70, 56);
  ctx.fillStyle = '#e9e2d0'; ctx.beginPath(); rr(70, 64, 172, 9, 4.5); ctx.fill();

  ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); rr(70, 64, 172, 9, 4.5); ctx.stroke();
}

// Level 1: Up in the Sky
function makeFly() {
  const s = { paused: true, y: 330, vy: 0, got: 0, goal: 12, objs: [], heartT: 0.5, stormT: 3, inv: 0, t: 0, done: false, doneT: 0 };
  s.bg = Array.from({ length: 6 }, () => ({ x: rand(0, W), y: rand(100, 520), s: rand(0.45, 0.9) }));
  s.hills = 0;
  s.update = dt => {
    s.t += dt;
    const prev = s.y;
    if (!s.done) {
      const k = (key('down') ? 1 : 0) - (key('up') ? 1 : 0);
      if (k) s.y += k * 300 * dt;
      else if (steering()) s.y += (input.py + 10 - s.y) * Math.min(1, dt * 7);
    } else {
      s.y += (H / 2 - s.y) * Math.min(1, dt * 2);
    }
    s.y = clamp(s.y, 110, H - 80);
    s.vy = (s.y - prev) / Math.max(dt, 1e-3);
    s.inv = Math.max(0, s.inv - dt);
    const speed = 150 + (s.got / s.goal) * 50;
    s.hills = (s.hills + speed * 0.25 * dt) % 160;
    for (const c of s.bg) { c.x -= speed * c.s * 0.35 * dt; if (c.x < -70) { c.x = W + 70; c.y = rand(100, 520); } }
    if (!s.done) {
      s.heartT -= dt;
      if (s.heartT <= 0) { s.heartT = rand(0.75, 1.15); s.objs.push({ k: 'heart', x: W + 30, y: rand(130, H - 100), ph: rand(0, 6) }); }
      s.stormT -= dt;
      if (s.stormT <= 0) {
        s.stormT = rand(1.5, 2.5);
        let y = rand(140, H - 110);
        const near = s.objs.find(o => o.k === 'heart' && o.x > W - 40 && Math.abs(o.y - y) < 70);
        if (near) y = near.y > H / 2 ? near.y - 150 : near.y + 150;
        s.objs.push({ k: 'storm', x: W + 60, y: clamp(y, 140, H - 110) });
      }
    }
    const hx = 95, hy = s.y - 8;
    for (let i = s.objs.length - 1; i >= 0; i--) {
      const o = s.objs[i];
      o.x -= speed * dt;
      if (o.x < -70) { s.objs.splice(i, 1); continue; }
      if (s.done) continue;
      if (o.k === 'heart') {
        const oy = o.y + Math.sin(s.t * 3 + o.ph) * 5;
        if (dist(hx, hy, o.x, oy) < 44) {
          s.objs.splice(i, 1); s.got++;

// Prize wheel. The odds printed on it are for show: the spin always ends on the 0.5% Snoopy slice.
const WHEEL = [

function makeWheel() {

  const sn = segs.find(g => g.snoopy), snMid = (sn.a0 + sn.a1) / 2;
  const s = { paused: false, t: 0, rot: 0.9, spinning: false, st: 0, from: 0, to: 0, dur: 7.5, landed: false, lt: 0, lastSeg: -1, shown: false, flick: 0, confT: 0 };
  const tufts = Array.from({ length: 16 }, () => [rand(0, W), rand(560, H - 6)]);

      ctx.fillStyle = on ? '#fff7b0' : '#b8231a';

    }

      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, g.a0 + s.rot - Math.PI / 2, g.a1 + s.rot - Math.PI / 2); ctx.closePath();

    inked(() => ctx.arc(cx, cy, 28, 0, TAU), C.yellow, 3);
    ctx.font = `700 18px ${DISPLAY}`; ctx.fillStyle = C.ink; ctx.textBaseline = 'middle';
    ctx.fillText('SPIN', cx, cy + 1); ctx.textBaseline = 'alphabetic';
    // pointer
    ctx.save(); ctx.translate(cx, cy - R - 12); ctx.rotate(-s.flick * 0.3);
    inked(() => { ctx.moveTo(-15, -22); ctx.lineTo(15, -22); ctx.lineTo(0, 18); ctx.closePath(); }, C.ink, 2);
    inked(() => { ctx.moveTo(-9, -17); ctx.lineTo(9, -17); ctx.lineTo(0, 9); ctx.closePath(); }, C.yellow, 0.01);
    ctx.restore();
    drawFx();
    panel(12, 12, 244, 70);
    ctx.textAlign = 'left'; ctx.fillStyle = C.ink;
    ctx.font = `15px ${BODY}`; ctx.fillText('PRIZE WHEEL', 70, 32);
    const msg = s.landed ? 'You got SNOOPY!' : s.spinning ? 'Spinning…' : 'Spin for your prize!';
    let fs = 25; ctx.font = `700 ${fs}px ${DISPLAY}`;
    while (fs > 14 && ctx.measureText(msg).width > 176) { fs--; ctx.font = `700 ${fs}px ${DISPLAY}`; }
    ctx.fillText(msg, 70, 62);
    drawPresent(40, 48, 0.85, C.purple);
    if (s.landed && s.lt < 2.4) bigBanner('SNOOPY!', s.lt, cy);
  };
  return s;
}
function prizeHTML() {
  const d = new Date();
  const month = d.toLocaleString('en-US', { month: 'long' });
  return `<div class="panel">
    <p class="eyebrow">Jackpot! You hit the 0.5% Snoopy</p>
    <h2>Here's your prize, ${esc(MOM)}</h2>
    <div class="ticket" role="img" aria-label="Prize ticket: one real-life birthday surprise">
      <div class="stub">ADMIT<br>ONE<br>${esc(MOM.toUpperCase())}</div>
      <div class="tk">
        <div class="tk-top">Snoopy jackpot · Grand prize</div>
        <div class="tk-main">One real-life birthday surprise</div>
        <div class="tk-fine">Show this ticket to the person who made you this game to claim it.</div>
        <div class="tk-meta">No. 0001 · ${month} ${d.getFullYear()} · Never expires</div>
      </div>
    </div>
    <p class="copy">Love you. Happy birthday!</p>
    <button class="btn light" type="button" data-act="again">Play again</button>
  </div>`;
}

// ---------- flow ----------
const LEVELS = [
  { make: makeFly, n: 1, name: 'Up in the Sky', goal: 'Snoopy is flying his doghouse to your party. Collect 12 hearts and steer around the storm clouds.', how: coarse ? 'Drag your finger up and down to fly.' : 'Move the mouse up and down, or use the ↑ ↓ arrow keys.' },
  { make: makeCatch, n: 2, name: 'Supper Time', goal: 'Treats are falling from the sky! Catch 15 in Snoopy’s supper dish. Dodge the rain clouds.', how: coarse ? 'Drag your finger left and right.' : 'Move the mouse left and right, or use the ← → arrow keys.' },
  { make: makeYard, n: 3, name: 'Party Hunt', goal: 'Find the 5 party things hidden around the yard, then bring them to the doghouse.', how: coarse ? 'Tap or hold where you want Snoopy to walk.' : 'Click where you want Snoopy to walk, or use the arrow keys.' }
];
let levelIdx = 0;
function startLevel(i) {
  levelIdx = i;
  const L = LEVELS[i];
  setScene(L.make());
  show(`<div class="panel tilt">
    <p class="eyebrow">Level ${L.n} of 3</p>
    <h2>${L.name}</h2>
    <p class="copy">${L.goal}</p>
    <p class="how">${L.how}</p>
    <button class="btn" type="button" data-act="go">Go!</button>
  </div>`);
}
function levelDone() {
  if (!scene || scene.leaving) return;
  scene.leaving = true;
  if (levelIdx < LEVELS.length - 1) startLevel(levelIdx + 1);
  else { setScene(makeParty()); hide(); happyBirthday(); }
}
function goTitle() { setScene(makeTitle()); show(titleHTML(), 'top'); }

overlay.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audio(); sfx.click();
  const act = b.dataset.act;
  if (act === 'start') startLevel(0);
  else if (act === 'go') { hide(); input.down = false; if (scene) scene.paused = false; }
  else if (act === 'prize') { setScene(makeWheel()); show(`<button class="btn" type="button" data-act="spin">Spin the wheel!</button>`, 'bottom'); }
  else if (act === 'spin') { hide(); if (scene && scene.spin) scene.spin(); }
  else if (act === 'again') goTitle();
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (scene) {
    if (!scene.paused) scene.update(dt);
    else if (scene.t !== undefined) scene.t += dt * 0.5;
    updateFx(dt);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate(rand(-5, 5) * shake * 2, rand(-5, 5) * shake * 2);
    scene.draw();
  }
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  document.fonts.load(`700 20px ${DISPLAY}`).catch(() => {});
  document.fonts.load(`20px ${BODY}`).catch(() => {});
}
// test hook for automated checks
window.__snoopy = { startLevel, levelDone, get scene() { return scene; }, goParty: () => { setScene(makeParty()); hide(); }, makeWheel, clearFx: () => { fx.length = 0; texts.length = 0; } };
})();
</script>
</body>
</html>
